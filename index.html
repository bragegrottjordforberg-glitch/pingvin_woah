<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <input id="myInput" onchange="setName(this)" placeholder="Navngi pingvinen">
    <!-- <button onclick="updateView()">Navngi pingvinen!</button> -->
    <div id="textbox"></div>

    <script>
        let hunger = 50;
        let age = 1;
        let clean = "Stinker og stanker...";
        let warmth = 50;
        let time = 10;
        let name = '';

        function setName(inputField){
            name = inputField.value;
            console.log(name)
            updateView()
        }

        

        function updateView(){
            let html = `${clean}`
            document.getElementById('textbox').innerHTML = /*html*/`
            <br>
            Pingvinen din = ${name}
            <br>
            <img id="img" src="OIP.png" onclick="penguinClicked">
            <br>
            <div> Sult = ${hunger}/100</div>
            <div> Varme = ${warmth}/100</div>
            <div> Renslighet = ${clean}</div>
            <div> Alder = ${age}/18</div>
            <img src="mat.png" class="food"  onclick="matetPingvin()"> 
        <button class="vaske" onclick="vasketPingvinen()">Vask pingvinen?</button>
        <button class= "varme" onclick="varmetPingvinen()">Varm opp pingvinen?</button>
            `
           
        }
        
        function matetPingvin(){
          
            if (hunger >= 1) {hunger += 15;
            let randomWarmth = Math.floor(Math.random() *25) +1;
            warmth -= randomWarmth;
            age +=1;
    }    else {
        gameOver("Pingvinen er sulten!")
        // alert("Pingvinen er sulten!")
    }
    if (warmth <= 1) {
        // alert ("Pingvinen er altfor kald!")
        gameOver("Pingvinen er altfor kald!")
        
    }
            let randomClean = Math.floor(Math.random() *3);
            if (randomClean >= 1) {
                clean = "Stinker og stanker";
            } 
            
            
            

            updateView()
        }
        
        function varmetPingvinen(){
            
            if (warmth >= 1) {
            warmth += 15;
            let randomHunger = Math.floor(Math.random() * 25) +1;
            hunger -= randomHunger;
            age +=1;} else {
                gameOver("Pingvinen er altfor kald!")
                //alert ("Pingvinen er altfor kald!")
            }

            if (hunger <= 1) {
                gameOver("Pingvinen er sulten!")
                //alert ("Pingvinen er sulten!")                
            } 
               
                
            let randomClean = Math.floor(Math.random() *3);
            if (randomClean >= 1) {
                clean = "Stinker og stanker";
            } 
            
            updateView()
        }

        function vasketPingvinen(){
            age += 1;
             let randomHunger = Math.floor(Math.random() * 25) +1;
            hunger -= randomHunger;
            let randomWarmth = Math.floor(Math.random() *25) +1;
            warmth -= randomWarmth;
            clean = "Ren og pen";
           
            updateView()
        }

        function gameOver(message){
            document.getElementById('textbox').innerHTML = /*html*/`
            <div>
                <h1>Game over</h1>
                <h2>${message}</h2>
            </div>
            `;
        }
    

    

        
        </script>
